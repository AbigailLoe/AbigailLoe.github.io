# This is the default format. 
# For more see: http://jekyllrb.com/docs/permalinks/
# permalink: /:categories/:year/:month/:day/:title 
permalink: /:categories/:title 

exclude: [".rvmrc", ".rbenv-version", "README.md", "Rakefile", "changelog.md"]
highlighter: rouge

markdown: kramdown

# Themes are encouraged to use these universal variables 
# so be sure to set them if your theme uses them.
#
title : Abigail Loe
tagline: Research and Teaching
url: https://abigailloe.github.io
name : Abigail Loe
description: Personal website for research and teaching

institution:
  url: https://www.macalester.edu
  name: Macalester College
department:
  url: https://www.macalester.edu/mscs/
  name: Department of Mathematics, Statistics and Computer Science
  address: 1600 Grand Ave
  office: Olin-Rice Science Center, Room 222
  city: Saint Paul, MN 55105
  workphone: +1-651-696-6000
author :
  name : Abigail Loe
  email : aloe [arroba] macalester [punto] edu
  github : abigailloe
  uri: https://abigailloe.github.io

# The production_url is only used when full-domain names are needed
# such as sitemap.txt
production_url : https://abigailloe.github.io

# All Jekyll-Bootstrap specific configurations are namespaced into this hash
#
JB :
  version : 0.3.0

  # All links will be namespaced by BASE_PATH if defined.
  # Links in your website should always be prefixed with {{BASE_PATH}}
  # however this value will be dynamically changed depending on your deployment situation.
  #
  BASE_PATH : false
  ASSET_PATH : false

  # These paths are to the main pages Jekyll-Bootstrap ships with.
  # Some JB helpers refer to these paths; change them here if needed.
  #
  archive_path: /archive.html
  categories_path : /categories.html
  tags_path : /tags.html
  atom_path : /atom.xml
  rss_path : /rss.xml

  # Settings for comments helper
  comments :
    provider : false
   
  # Settings for analytics helper
  analytics :
    provider : false

  # Settings for sharing 
  sharing :
    provider : false
   
# allow page redirection
plugins:
  - jekyll-redirect-from
  - jekyll-feed

future: true

redcarpet: 
  extensions:
   - tables
   - no_intra_emphasis
   - autolink
   - superscript
   - strikethrough

exclude:
  - "*.branches"
  - "*.kml"
  - "*.log"
  - "*.nb"
  - "*.trees"
  - "*.cpp"
  - "*.h"
  - "*.hh"
  - "*.java"
  - "*.jar"
  - "*.csv"
  - "*.tsv"
  - "*.txt"
  - "*.rb"
  - "*.py"
  - "*.class"
  - "*.tips"
  - "*.fasta"
  - "*.nex"
  - Gemfile
  - Gemfile.lock
